server {
    listen 127.0.0.1:18480;
    server_name localhost;
    include /etc/nginx/snippets/hooya-static.conf;
}
server {
    listen 80;
    listen [::]:80;
    server_name hooyamode.ir www.hooyamode.ir;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hooyamode.ir/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://hooyamode.ir$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hooyamode.ir;
    ssl_certificate /etc/letsencrypt/live/hooyamode.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooyamode.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/hooya-static.conf;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hooyamode.ir;
    ssl_certificate /etc/letsencrypt/live/hooyamode.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooyamode.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://hooyamode.ir$request_uri;
}
