server {
    listen 127.0.0.1:18480;
    server_name localhost;
    include /etc/nginx/snippets/hooya-static.conf;
}
server {
    listen 80;
    listen [::]:80;
    server_name hooyamode.ir www.hooyamode.ir;
    include /etc/nginx/snippets/hooya-static.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hooyamode.ir/acme;
        default_type text/plain;
        try_files $uri =404;
    }
}
