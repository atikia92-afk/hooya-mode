root /var/www/hooyamode.ir/current;
index index.html;
# Cloudflare's published proxy ranges, verified 2026-11-21. Trust the visitor
# address header only from these networks, not from direct origin connections.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
etag on;
gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_comp_level 6;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml;
add_header X-Content-Type-Options nosniff always;
add_header X-Hooya-Hosting vps always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Cache-Control "no-cache, no-transform" always;
location = /admin { return 302 /admin/; }
location = /admin/api/catalog {
    access_log off;
    proxy_pass http://127.0.0.1:18481;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    # The catalog may include optimized photographs; the application caps it at 900 kB.
    client_max_body_size 1m;
    error_page 413 = @hooya_catalog_too_large;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
location @hooya_catalog_too_large {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 413 '{"error":"حجم اطلاعات محصولات بیش از حد مجاز است. تعداد یا حجم عکس‌ها را کاهش دهید. تغییرهای محلی شما محفوظ است."}';
}
location ^~ /admin/ {
    access_log off;
    proxy_pass http://127.0.0.1:18481;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
location ^~ /assets/fonts/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800, no-transform";
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /assets/ {
    try_files $uri =404;
    set $hooya_asset_cache "public, max-age=300, stale-while-revalidate=60, no-transform";
    if ($arg_v ~ "^[a-f0-9]{12}$") { set $hooya_asset_cache "public, max-age=31536000, immutable, no-transform"; }
    add_header Cache-Control $hooya_asset_cache;
    add_header X-Content-Type-Options nosniff always;
}
location / { try_files $uri $uri/ =404; }
location = / {
    try_files /index.html =404;
    etag off;
    if_modified_since off;
}
location ~ \.html$ {
    try_files $uri =404;
    etag off;
    if_modified_since off;
}
location ^~ /api/customer/ {
    access_log off;
    proxy_pass http://127.0.0.1:18481;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    client_max_body_size 24k;
    add_header Cache-Control "no-store" always;
}
location ~ /\. { deny all; }
